page_id: advanced-methods
title: Rivilė API — advanced methods
description: Every Rivilė GAMA API v2 method, grouped by area, with its inputs.
components:
- component_id: advanced_intro
  type: markdown
  title: Advanced methods
  body: |
    Every Rivilė GAMA API v2 method as its own step, named **Advanced · …** in the step picker, grouped below by area. Each links to its page in the Rivilė guide.

    Results every method returns:

    - **Standard results:** `method`, `records`, `record`, `record_type`, `other_tables`, `count`, `data_errors`, `partial_success`, `http_status`, `duration_ms`.
    - **List results** (methods that page): `page_number`, `next_page`, `pages_fetched`, `has_more`.

    `records` is the main returned table and `record` its first row — for a write, the saved record with its new code.
- component_id: advanced_coverage
  type: markdown
  title: Coverage
  body: |
    - **Covered:** all 209 methods documented in the Rivilė GAMA API v2 guide, each as its own operation.
    - **Params:** every documented param (438 in all) is its own input, with the guide's description, allowed values and required flag. The `data` input takes the guide's field names; extra fields (`PAP_*`, `I49_DIM*`) pass through.
    - **Newer than this release:** `extra_params` passes a param the guide added later; **Call any Rivile method** sends any method (always treated as a write).
    - **Not offered: JSON answers.** Answers are requested as XML, Rivilė's default; values stay text, so codes such as `301` and `301.` stay distinct.
    - **Not offered: automatic paging by last key.** Rivilė recommends filtering by the last key received; set that filter in `fil`. The extension pages by `page_number`.
    - **Not offered: rate coordination across steps.** Pacing works within one step; use a separate API key per integration.
    - **Not offered: gateway settings.** Manorivile-Gateway is installed and configured on your server.
    - **Not offered: file content in write answers.** Download a file with **Download document file**.
