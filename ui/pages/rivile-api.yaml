title: Rivile API
description: 'Every Rivile step: what it does, which Rivile method it calls, its inputs and results.'
components:
- component_id: operations_everyday
  type: markdown
  title: Everyday operations
  body: |
    These steps take plain inputs and make the Rivile calls for you. Each one names the Rivile methods it uses, with a link to the Rivile guide. Every Rivile method is also available on its own, as **Advanced · …** — see **Advanced methods** below.

    ### Test the connection

    Checks the API key and that Manorivile-Gateway reaches the Rivile GAMA database with one read-only request (GET_N45_LIST, currencies).

    - Action id: `test_connection`
    - Kind: read
    - Rivile methods: [GET_N45_LIST](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_n45_list)
    - Inputs: none
    - Results: `connected`, `api_user`, `currencies`, `duration_ms`, `http_status`

    ### Find or create customer / supplier

    Looks the client up by company code, then VAT code, then client code (GET_N08_LIST); several matches or conflicting identifiers are an error. Creates it (EDIT_N08) only when none matches, so running it again is safe — but not two runs at the same time.

    - Action id: `find_or_create_client`
    - Kind: write
    - Rivile methods: [GET_N08_LIST](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_n08_list), [EDIT_N08](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/edit_n08)
    - Inputs: `company_code` (optional), `vat_code` (optional), `client_code` (optional), `name` (optional), `address` (optional), `location_code` (optional), `email` (optional), `phone` (optional), `client_type` (optional), `legal_entity` (optional), `account_relation_code` (optional), `tax_table_code` (optional)
    - Results: `client_code`, `created`, `matched_by`, `match_count`, `record`

    ### Create sales invoice

    Creates a sales invoice (EDIT_I06_FULL, I06_OP_TIP 51) with its lines in one request, finding or creating the customer first when company_code or vat_code is given; optionally posts it. A failed line rolls the whole document back.

    - Action id: `create_sales_invoice`
    - Kind: write
    - Rivile methods: [GET_N08_LIST](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_n08_list), [EDIT_N08](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/edit_n08), [GET_I06_LIST](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_i06_list), [EDIT_I06_FULL](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/edit_i06_full), [EDIT_I06](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/edit_i06)
    - Inputs: `company_code` (optional), `vat_code` (optional), `client_code` (optional), `name` (optional), `address` (optional), `location_code` (optional), `email` (optional), `phone` (optional), `client_type` (optional), `legal_entity` (optional), `account_relation_code` (optional), `tax_table_code` (optional), `number` (optional), `date` (optional), `due_date` (optional), `currency` (optional), `foreign_currency` (optional), `department_code` (optional), `prices_include_vat` (optional), `notes` (optional), `lines`, `post` (optional)
    - Results: `document_code`, `number`, `created`, `client_code`, `client_created`, `total_net`, `total_vat`, `total`, `posted`, `post_error`, `record`

    ### Create purchase invoice

    Creates a purchase invoice (EDIT_I06_FULL, I06_OP_TIP 1) with its lines in one request, finding or creating the supplier first when company_code or vat_code is given; optionally posts it. A failed line rolls the whole document back.

    - Action id: `create_purchase_invoice`
    - Kind: write
    - Rivile methods: [GET_N08_LIST](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_n08_list), [EDIT_N08](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/edit_n08), [GET_I06_LIST](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_i06_list), [EDIT_I06_FULL](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/edit_i06_full), [EDIT_I06](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/edit_i06)
    - Inputs: `company_code` (optional), `vat_code` (optional), `client_code` (optional), `name` (optional), `address` (optional), `location_code` (optional), `email` (optional), `phone` (optional), `client_type` (optional), `legal_entity` (optional), `account_relation_code` (optional), `tax_table_code` (optional), `number` (optional), `date` (optional), `due_date` (optional), `currency` (optional), `foreign_currency` (optional), `department_code` (optional), `prices_include_vat` (optional), `notes` (optional), `lines`, `post` (optional)
    - Results: `document_code`, `number`, `created`, `client_code`, `client_created`, `total_net`, `total_vat`, `total`, `posted`, `post_error`, `record`

    ### Attach file to document

    Attaches a workflow file (e.g. the invoice PDF) to a purchase or sales document (EDIT_I06_DOC). Rivile is not asked to echo the file back.

    - Action id: `attach_file_to_document`
    - Kind: write
    - Rivile methods: [EDIT_I06_DOC](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/edit_i06_doc)
    - Inputs: `document_code`, `document_file`, `file_extension` (optional), `replace_existing` (optional)
    - Results: `document_code`, `file_extension`, `record`

    ### Download document file

    Downloads the file attached to a purchase or sales document (GET_I06_DOC) as a workflow file.

    - Action id: `download_document_file`
    - Kind: read
    - Rivile methods: [GET_I06_DOC](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_i06_doc)
    - Inputs: `document_code`
    - Results: `document_code`, `found`, `document_file`, `original_filename`, `original_content_type`, `link`

    ### Register payment

    Records a payment against a purchase or sales document (EDIT_I13: I13_KODAS_PO, I13_KODAS_SS, I13_SUMA). First reads the document's payments (GET_I06_LIST list=A); a payment with the same money account and amount is returned with created=false instead of being added again.

    - Action id: `register_payment`
    - Kind: write
    - Rivile methods: [EDIT_I13](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/edit_i13)
    - Inputs: `document_code`, `amount`, `money_account_code`, `currency_amount` (optional), `description` (optional)
    - Results: `document_code`, `line_number`, `created`, `record`

    ### Find or create product

    Looks a product up by code (GET_N17_LIST) or barcode (GET_N37_LIST, then GET_N40_LIST); a barcode that belongs to another product is an error. Creates the product with its unit and barcode (EDIT_N17_FULL) only when none matches.

    - Action id: `find_or_create_product`
    - Kind: write
    - Rivile methods: [GET_N17_LIST](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_n17_list), [GET_N37_LIST](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_n37_list), [GET_N40_LIST](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_n40_list), [EDIT_N17_FULL](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/edit_n17_full)
    - Inputs: `product_code` (optional), `barcode` (optional), `name` (optional), `unit` (optional), `product_type` (optional), `account_relation_code` (optional)
    - Results: `product_code`, `created`, `matched_by`, `notes`, `record`

    ### Read stock levels

    FIFO stock balance per product, unit and warehouse (GET_I17_LIST grouped by I17_KODAS_IS), as decimal quantities in the base unit.

    - Action id: `stock_levels`
    - Kind: read
    - Rivile methods: [GET_I17_LIST](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_i17_list)
    - Inputs: `product_code` (optional), `warehouse_code` (optional), `page` (optional), `max_pages` (optional)
    - Results: `items`, `count`, `has_more`, `next_page`

    ### Read product prices

    Every price, price list, promotion and discount Rivile resolves for a product (GET_PS_KAIN), flattened.

    - Action id: `product_prices`
    - Kind: read
    - Rivile methods: [GET_PS_KAIN](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_ps_kain)
    - Inputs: `product_code` (optional), `barcode` (optional), `unit` (optional), `warehouse_code` (optional), `client_code` (optional)
    - Results: `items`, `count`

    ### Read records changed since a date

    Clients, products, prices (all products) or stock changed since a date (the *_TIME methods; run Advanced · Enable change tracking (INIT_TRIGGER) once first), or documents corrected since then (GET_I06_LIST by I06_R_DATE).

    - Action id: `changes_since`
    - Kind: read
    - Rivile methods: [GET_CLIENTS_TIME](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_clients_time), [GET_PROD_BY_BARCODE_TIME](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_prod_by_barcode_time), [GET_PRICES_TIME](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_prices_time), [GET_I17_LIST_TIME](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_i17_list_time), [GET_I06_LIST](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_i06_list)
    - Inputs: `entity`, `since`, `page` (optional), `max_pages` (optional)
    - Results: `entity`, `method`, `records`, `count`, `has_more`, `next_page`

    ### Read client debt

    Debt totals of a client or supplier (GET_T03_LIST): debit, credit and balance (debit − credit).

    - Action id: `client_debt`
    - Kind: read
    - Rivile methods: [GET_T03_LIST](https://gidas.rivile.lt/internetiniai_moduliai/api_rest/get_t03_list)
    - Inputs: `client_code`
    - Results: `client_code`, `debit`, `credit`, `balance`, `rows`
- component_id: operations_behaviour
  type: markdown
  title: How operations behave
  body: |
    ### Inputs

    - Every step needs a **connection**: the Rivile API key it runs with.
    - Everyday steps take plain inputs. Codes your company sets up its own way — the account relation code for new clients (`PT001`) and products (`PR001`), the tax table (`PVM`), money accounts — are inputs; the defaults are the Rivile guide's examples, so replace them with your own.
    - Advanced methods take Rivile's params as separate inputs and a `data` block with Rivile's own field names, as in the Rivile guide, for example `{"N08": {"N08_KODAS_KS": "121411842", "N08_PAV": "UAB X"}}`. Document methods ending in `_FULL` take their lines inside the header.

    ### Results

    - Values are text exactly as Rivile sent them. With **Trim values** on, only trailing padding is removed; leading spaces in Rivile codes are kept.
    - Rivile's refusals per field are in `data_errors` (tag, code, message).

    ### Lists

    - Rivile returns 100 records per page. Set `page_number`, or turn on `fetch_all_pages` (up to `max_pages`).
    - A step output has a size limit. A long read stops at the last page that fits and returns `has_more` and `next_page`. For whole tables use **Export a Rivile list to a JSONL file**.

    ### Files

    - **Attach file to document** takes a workflow file, for example the invoice PDF from an earlier step.
    - **Download document file** saves the attachment as a workflow file.

    ### Writes, retries and errors

    - Every write goes through Flow Steward's external-effect record, so a retried step does not send the same write twice. Test runs never write.
    - **HTTP 400:** Rivile refused the data and nothing was saved. The step fails with Rivile's message.
    - **HTTP 207:** part of a document was saved. The step succeeds with `partial_success: true`; check `data_errors`.
    - **Gateway unavailable (502/503) on a read:** retried.
    - **Timeout or 5xx on a write:** Rivile may have saved it. The step fails as `timeout_unknown` and is not retried; check the document in Rivile first.
    - **Record locked (423):** another user is editing the record. Retried after 1, 2, 4 and 8 seconds.
    - **Rate limit (429):** Rivile allows 10 requests per second per key. The extension paces itself and backs off. Steps running in parallel on one key share that limit.
    - If a step that writes several things fails half-way, it says exactly what was already created and is not retried.

    ### Empty values: MS SQL and Sybase

    - **Field left out:** Rivile applies its default on both servers.
    - **Empty text `""`:** MS SQL stores it empty; Sybase treats it like a left-out field and applies the default.
    - **One space `" "`:** on Sybase, the way to store an empty value.
- component_id: advanced_intro
  type: markdown
  title: Advanced methods
  body: |
    Every Rivile GAMA API v2 method as its own step, named **Advanced · …** in the step picker, grouped below by area. Each links to its page in the Rivile guide.

    Results every method returns:

    - **Standard results:** `method`, `records`, `record`, `record_type`, `other_tables`, `count`, `data_errors`, `partial_success`, `http_status`, `duration_ms`.
    - **List results** (methods that page): `page_number`, `next_page`, `pages_fetched`, `has_more`.

    `records` is the main returned table and `record` its first row — for a write, the saved record with its new code.
