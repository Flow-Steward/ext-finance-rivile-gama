- component_id: advanced_any_method
  type: markdown
  title: Any method and exports
  body: |
    ### Call any Rivile method

    Sends one request with any Rivile GAMA API v2 method, params and data. Treated as a write: suppressed in test runs and recorded in the external-effect ledger.

    - Action id: `call_method` · write · Rivile method: any — you name it
    - Inputs: `method`, `params` (optional), `data` (optional)
    - Results: `method`, `records`, `record`, `record_type`, `other_tables`, `count`, `data_errors`, `partial_success`, `http_status`, `duration_ms`

    ### Export a Rivile list to a JSONL file

    Reads a Rivile list method page by page (100 records per page, paced to Rivile's rate limit) and saves every record as one JSON line in a workflow file (rivile-export.jsonl). Each line carries its Rivile table in _table.

    - Action id: `export_list` · read · Rivile method: any — you name it
    - Inputs: `method`, `params` (optional), `max_pages` (optional), `start_page` (optional)
    - Results: `artifact_handle`, `filename`, `content_type`, `record_count`, `pages_fetched`, `complete`, `resume_page`, `record_type`
- component_id: advanced_coverage
  type: markdown
  title: Coverage
  body: |
    - **Covered:** all 209 methods documented in the Rivile GAMA API v2 guide, each as its own operation.
    - **Params:** every documented param (438 in all) is its own input, with the guide's description, allowed values and required flag. The `data` input takes the guide's field names; extra fields (`PAP_*`, `I49_DIM*`) pass through.
    - **Newer than this release:** `extra_params` passes a param the guide added later; **Call any Rivile method** sends any method (always treated as a write).
    - **Not offered: JSON answers.** Answers are requested as XML, Rivile's default; values stay text, so codes such as `301` and `301.` stay distinct.
    - **Not offered: automatic paging by last key.** Rivile recommends filtering by the last key received; set that filter in `fil`. The extension pages by `page_number`.
    - **Not offered: rate coordination across steps.** Pacing works within one step; use a separate API key per integration.
    - **Not offered: gateway settings.** Manorivile-Gateway is installed and configured on your server.
    - **Not offered: file content in write answers.** Download a file with **Download document file**.
