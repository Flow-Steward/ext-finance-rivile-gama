    ## 0.1.4

    ### Changed

    - Clarified the catalog description, supported operations and connection setup.

    ### Security

    - Updated the CI pytest pin from 8.3.5 to 9.0.3.

    ## 0.1.3

    ### Changed

    - README: the icon note removed.
    - Releases: the release text is this version's section of the changelog, checked before anything is built,
      followed by GitHub's list of changes since the previous release.

    ## 0.1.2

    ### Fixed

    - A write answered with any status Rivile does not document as "nothing done" (only 400, 401,
      403, 423 and 429 are) — for example 501, 520 or 524 — is now `timeout_unknown` and not
      retried, instead of "failed, no effect". Redirects are refused, and unknown for writes.
    - Register payment first reads the document's payments (GET_I06_LIST list=A) and returns an
      identical payment (same money account and amount) with `created: false` instead of adding it
      twice.
    - Create invoice: an unposted invoice found by number on a rerun is posted when `post` is set,
      and `posted` reports its real state.
    - `currency` is only accepted together with `foreign_currency`; alone it made Rivile treat
      base-currency prices as currency prices.
    - Stock levels and Changes since take a start `page` and continue from `next_page`.
    - `show_doc` given as text, and file fields in any letter case, are handled; a declared input
      file over 15 MB is refused before it is read, within the step's time limit.
    - File downloads are limited to 40 MB, which fits Rivile's Base64 answer; the error says so.
    - Input checks shared by every operation (`max_pages: "5"` is accepted everywhere).
    - Support and website links point at Flow-Steward/ext-finance-rivile-gama.

    ## 0.1.1

    ### Fixed

    - **Attach file to document** and **Advanced · Purchase/sales document: attach, replace or remove
      a file / files (EDIT_I06_DOC, EDIT_I06_DOCS)** now show a file picker for `document_file` in the step form; before, the
      file could not be chosen.
    - A test checks that every input of every operation has a matching form field (widget by value
      type, required flag), that every file input has a file picker, and that actions and
      operations declare the same inputs and results.

    ## 0.1.0

    First release, not yet verified against a live Rivile GAMA key (1.0.0 follows that check).

    ### Everyday operations

    - Eleven everyday operations, listed first in the step picker: Find or create customer / supplier,
      Create sales invoice, Create purchase invoice, Attach file to document, Download document file,
      Register payment, Find or create product, Stock levels, Product prices, Changes since, Client debt.
    - The 209 raw methods and Call any Rivile method are named "Advanced · …" (the step picker lists
      operations flat, by name; it has no grouping field).
    - Composite writes report exactly what was created when a later call fails, and are not retried.
    - Icon: the official Rivile mark from https://www.rivile.lt/favicon.svg (© Rivile), scaled to
      128×128 with proportions and colour unchanged, used to identify the integration. Listing
      categories finance, inventory, hr.
    - The product name is written "Rivile" / "Rivile GAMA" in plain Latin letters everywhere users
      read it; quoted Lithuanian text from the Rivile guide is unchanged.
    - Pages: a one-minute Setup Guide (one block for whoever sets up Rivile and the gateway, one for
      whoever connects in Flow Steward); Connection with "How to get the API key"; one "Rivile API" page (each
      everyday step with its Rivile methods, inputs and results; how steps behave; every method by
      area; coverage); Changelog. No tables; internal effect fields are not listed as results.

    - Review round 3: Rivile fields read case-insensitively (client debt was always 0 because T03 answers
      in lower case); explicit `foreign_currency` (a base-currency code keeps net/gross price fields);
      several matches or conflicting identifiers refused before any write; `KIEKIS_U` sent with all three
      unit codes; codes allowlisted before they enter a filter; invoices with a number looked up first
      (`created` output); running out of time after a write reported as such; a created client without
      an echoed code read back; no posting without a document code; test-mode results carry every
      declared output; Decimal money and quantities with Rivile precision and bounds; stock with
      `alt_unit`; prices changes for every product; documented datetime form; `Advanced ·` export.

    ### Complete Rivile GAMA API v2 coverage and hardening

    Review fixes before the first release:

    - Round 2: record_locked only on HTTP 423 or a 400 whose errorMessage starts "423:", never over
      an ambiguous 5xx write; one step deadline (600 s budget) for every request and backoff, with
      fetch_all/export stopping in time and reporting next_page/resume_page; export saves what it has
      at 200 MB; the API key is redacted from raw bodies before parsing; whole results metered,
      oversized write echoes shortened instead of failed; linear error recovery.

    - `get_i06_doc` / `export_list` write files under the exact granted content type; the Rivile
      file name/type are reported as `original_filename` / `original_content_type`.
    - Writes answered 502/503 are `timeout_unknown` and not retried; reads stay retryable.
    - The main table is no longer duplicated (`tables` → `other_tables`); multi-page reads stop at the
      last page that fits the host's secret scan and output cap and report `next_page`.
    - `EDIT_PAP` sends its fields in `data.PAP`; `GET_USER_PROC` is a write (external effect).
    - 429 and 423 (record locked) back off 1/2/4/8 s; DNS failure and IncompleteRead are connection
      failures; failures before sending are `definitely_no_external_effect`.
    - `export_list` stops before the step time limit, saves what it read, returns `resume_page`;
      `start_page` resumes it. No second in-memory copy of the file.
    - `show_doc` defaults to 0 for EDIT_I06_DOC(S)/GET_I06_DOCS and write results never carry file
      content; metadata-only updates (oper U) need no file; unknown upload types need `ext`.
    - 400 bodies up to 4 MB are parsed, and dataErrors are recovered from cut bodies.
    - Required params enforced (GET_VIEWS_LIST, GET_I06_DOC(S), EDIT_I06_DOC(S), EDIT_BUS with its
      module list, GET_USER_PROC, GET_I06_DEBT); `list` values per method (GET_N17_LIST has F);
      `oper` on the FULL methods that document it; `top` sets the page size.
    - Data schemas: field lists and descriptions from the guide's field tables, one record per request.
    - Trailing padding trimmed, leading spaces kept; Rivile error text redacted of the API key.
    - Category `finance` (+ inventory, hr).

    Initial scope:

    - All 209 methods of the Rivile GAMA API v2 guide as typed workflow operations
      (91 read, 118 write), generated from the guide.
    - `test_connection`, `call_method` (any method) and `export_list` (JSONL export).
    - API-key connection type; fixed endpoint `api.manorivile.lt`.
    - Writes declared as external effects, suppressed in test runs.
    - Rivile `dataError` details in failures; HTTP 207 as partial success.
    - Paged reads with Rivile rate-limit pacing.
    - Document attach from workflow files (`EDIT_I06_DOC`/`EDIT_I06_DOCS`) and download to a workflow file (`GET_I06_DOC`).
