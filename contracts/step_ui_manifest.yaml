# Do not edit by hand: tests/test_contracts.py fails when this file drifts.
forms:
- operation_id: test_connection
  title: Test the connection
  fields: []
- operation_id: find_or_create_client
  title: Find or create customer / supplier
  fields:
  - name: company_code
    label: Company code
    widget_type: text
    required: false
    help_text: Registration code (N08_IM_KODAS), looked up first. Several matches, or a match whose VAT
      or client code differs from the ones given, is an error and nothing is created. Letters, digits,
      spaces and . _ / - only.
  - name: vat_code
    label: VAT code
    widget_type: text
    required: false
    help_text: VAT payer code, e.g. LT214118411 (N08_PVM_KODAS), looked up second. Letters, digits, spaces
      and . _ / - only.
  - name: client_code
    label: Client code
    widget_type: text
    required: false
    help_text: Rivile client code (N08_KODAS_KS, up to 12 characters), looked up last; used as the new
      code when creating (else Rivile numbers it). Letters, digits, spaces and . _ / - only.
  - name: name
    label: Name
    widget_type: text
    required: false
    help_text: Client name, used when the client has to be created (N08_PAV).
    placeholder: Example customer Ltd
  - name: address
    label: Address
    widget_type: text
    required: false
    help_text: N08_ADR.
  - name: location_code
    label: Location code
    widget_type: text
    required: false
    help_text: Rivile location (vietovė) code, N08_KODAS_VS. Rivile has no country field.
  - name: email
    label: E-mail
    widget_type: text
    required: false
    help_text: N08_E_MAIL.
  - name: phone
    label: Phone
    widget_type: text
    required: false
    help_text: N08_TEL.
  - name: client_type
    label: Client type
    widget_type: select
    required: false
    help_text: customer, supplier or both (N08_RUSIS 1/2/3).
    options:
    - label: customer
      value: customer
    - label: supplier
      value: supplier
    - label: both
      value: both
  - name: legal_entity
    label: Legal entity
    widget_type: boolean
    required: false
    help_text: 'true: company (N08_TIPAS 1, default); false: natural person (2).'
  - name: account_relation_code
    label: Account relation code
    widget_type: text
    required: false
    help_text: N08_KODAS_DS, required by Rivile for buyers and suppliers. Default PT001 (the guide's example)
      — use your company's code.
  - name: tax_table_code
    label: Tax table code
    widget_type: text
    required: false
    help_text: N08_KODAS_XS_P / _T. Default PVM (the guide's example).
