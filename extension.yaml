manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.rivile-gama
kind: tool_provider
version: 0.1.6
release_stage: active
billing_mode: free
display_name: Rivile GAMA
description: 'Connect the Rivile GAMA system behind Manorivile-Gateway to Flow Steward using REST API
  v2. Everyday operations find or create clients and products, create sales or purchase invoices with
  optional posting, register document payments and attach or download document files. Stock, price, client-balance
  and date-based change readers provide building blocks for storefront updates, accounting exchanges and
  debt review.


  For integrations needing more of GAMA''s data model, the release contains typed operations for 209 methods
  from its pinned API reference. Supported families include purchases and sales, general ledger, debts
  and payments, products and services, inventory and stocktaking, production, fixed assets, prices, payroll,
  personnel, point of sale, loyalty and gift vouchers, contracts and document management. Advanced steps
  accept the corresponding method parameters and Rivile data blocks, while list export can write paginated
  records to a JSONL workflow file.


  Each connection uses a Rivile API key and the associated user''s rights. The gateway and company settings
  determine which functions are available. Workflows can combine everyday steps with the more detailed
  method operations for company-specific document and inventory processes. Configure Rivile change tracking
  before relying on the incremental readers that require it.'
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-finance-rivile-gama/issues
  website_url: https://github.com/Flow-Steward/ext-finance-rivile-gama
listing:
  category: finance
  tags:
  - rivile
  - rivile-gama
  - accounting
  - erp
  - lithuania
  - invoices
  - vat
  - inventory
  - payroll
  summary: Connect Rivile GAMA invoices, clients, products, payments, stock and files, with advanced accounting,
    inventory, payroll and personnel methods.
  categories:
  - finance
  - inventory
  - hr
  setup_summary: Enable the Rivile API service with a valid version-access agreement, use GAMA 119 or
    later and run Manorivile-Gateway beside the company database. Add the username.secret API key to a
    project connection and check the Rivile user rights and relevant RGI parameters, including change-tracking
    initialization when needed.
features:
- tool
- action
required_scopes:
- extension:invoke
- artifact:read
- artifact:write
machine_auth:
  service_account_key: svc_ext_rivile_gama
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
account_scope:
  scope_type: project
  description: Each Rivile GAMA API key is a project connection. A project may hold several, for example
    one per company database or integration.
egress:
  hosts:
  - api.manorivile.lt
